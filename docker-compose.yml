# Development database only.
#   docker compose up -d postgres
#
# SCIP ships as a Windows desktop app that bundles its own PostgreSQL/PostGIS (see
# docs/desktop-architecture.md). This container exists so `npm run dev:api` and the e2e tests
# have the same database engine without building the desktop app.
#
# Host port 5433 is deliberately non-default so it does not collide with a Postgres already
# running on the machine.

services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: scip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scip_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-scip}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - scip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scip} -d ${POSTGRES_DB:-scip}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  scip_pgdata:
