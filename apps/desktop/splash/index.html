<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCIP</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash">
      <header>
        <!-- Same SVG as the Logo component in apps/web/src/components/ui.tsx. -->
        <p class="brand">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path
              d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5Zm8 4.2L5.6 8.9v5.4l6.4 3.6 6.4-3.6V8.9Z M9.6 10.2a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0Z"
              fill="currentColor"
              fill-rule="evenodd"
            />
            <path id="logo-dot" class="logo-dot" d="M10.9 10.2a1.1 1.1 0 1 0 2.2 0a1.1 1.1 0 1 0 -2.2 0Z" />
          </svg>
          <span>SCIP</span>
        </p>
        <h1 id="headline">Démarrage en cours</h1>
        <p class="sub" id="subline">Préparation des services locaux…</p>
      </header>
      <ol id="steps" class="steps" aria-live="polite"></ol>
      <section id="error" class="error" hidden role="alert">
        <h2 id="error-title"></h2>
        <ul id="error-details"></ul>
        <p id="error-log" class="log"></p>
      </section>
      <footer id="footer" class="footer"></footer>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
