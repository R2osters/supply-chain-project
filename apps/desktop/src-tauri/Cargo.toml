[package]
name = "scip-desktop"
version = "0.2.0"
description = "SCIP desktop shell and process supervisor"
authors = ["SCIP"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows (cargo issue #8519).
name = "scip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
getrandom = "0.3"
# rustls: the update feed and installers come from GitHub over HTTPS (webpki roots built in).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# Backups: a plain tar, the Documents folder, and local time for the file names.
tar = "0.4"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Updates: SHA-256 of the downloaded installer and the Ed25519 signature of the publisher.
sha2 = "0.10"
ed25519-dalek = "2"

[features]
# Test builds only: lets SCIP_UPDATE_PUBLIC_KEY replace the publisher's key (update e2e).
# Debug builds allow it anyway; a release build without this feature trusts only update-key.pub.
update-test = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smaller installer; the shell does little CPU work, the sidecars do the heavy lifting.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
