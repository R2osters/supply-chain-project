# Tests every push; builds the Windows installer on master and on version tags.
name: desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing else: the jobs publish nothing (releases are signed and published from
# the publisher's PC), so a compromised step gets a token that cannot write to the repository.
permissions:
  contents: read

# Every action is pinned to a commit (tag in the comment): a moved tag cannot change what runs
# here. To update one, resolve the new tag with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Pinned to a commit of its `stable` branch; the toolchain is named rather than left to the
      # branch's default.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/installer/src-tauri
      - run: npm ci
      - run: npm run build --workspace @scip/shared
      - run: npx prisma generate
        working-directory: apps/api
      - name: API unit tests
        run: npm test --workspace @scip/api
      - name: Web typecheck and unit tests
        run: |
          npm run typecheck --workspace @scip/web
          npx vitest run
        working-directory: apps/web
      # Tauri's build script embeds the frontend folder, which must exist even for tests.
      - name: Placeholder frontend for the Rust build
        run: New-Item -ItemType Directory -Force apps/desktop/web-dist | Out-Null
        shell: pwsh
      - name: Desktop shell tests and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
        working-directory: apps/desktop/src-tauri
      - name: Installer tests and lint
        run: |
          npm run lint --workspace @scip/installer
          npm test --workspace @scip/installer
      - name: Release tooling tests
        run: npm run release:test

  installer:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # build-desktop.ps1 picks Python 3.12 through the py launcher and installs PyInstaller itself.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/installer/src-tauri
      # PostgreSQL, PostGIS and Node archives: ~500 MB that rarely change.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/desktop/.cache
          key: desktop-downloads-${{ hashFiles('apps/desktop/scripts/stage-node.mjs', 'apps/desktop/scripts/stage-postgres.mjs') }}
      # Natural Earth data and glyphs for the offline basemap (~80 MB of sources, pinned versions).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.basemap-cache
          key: basemap-sources-${{ hashFiles('apps/web/scripts/fetch-basemap.mjs') }}
      - run: npm ci
      - name: Stage runtimes, API, AI and web export
        run: npm run desktop:stage
      # SCIP-Setup-<version>.exe, the installer users run (apps/installer). No Authenticode
      # certificate and no update key here: releases are signed on the publisher's PC
      # (npm run release, DEPLOYMENT.md "Mises à jour"), so this artifact is for testing.
      - name: Build SCIP and SCIP Setup
        run: npm run build --workspace @scip/installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scip-windows-installer
          path: apps/installer/dist/SCIP-Setup-*.exe
          if-no-files-found: error
